---
# ===========================================================================
# What to do. One role, four entry points.
#   install    - lay down the package and register any instance not yet configured
#   reregister - unregister then re-register existing instances (new token/labels/group)
#   remove     - unregister and optionally delete the directory
#   upgrade    - stop, overlay a newer runner package, start (for --disableupdate fleets)
# ===========================================================================
github_runner_action: install

# ---------------------------------------------------------------------------
# GitHub scope
# ---------------------------------------------------------------------------
github_runner_scope: enterprise            # enterprise | organization | repository
github_runner_enterprise: ""               # enterprise slug
github_runner_org: ""                      # org login
github_runner_repo: ""                     # owner/repo

# For GHE.com data residency, override both with your subdomain, e.g.
#   https://api.acme.ghe.com  /  https://acme.ghe.com
github_runner_api_url: "https://api.github.com"
github_runner_server_url: "https://github.com"

# ---------------------------------------------------------------------------
# Auth
# ---------------------------------------------------------------------------
# Token used to MINT short-lived registration/removal tokens.
github_runner_api_token: ""

# Or hand the role pre-minted tokens and skip the API entirely.
# They are valid for one hour, so this only works for short runs.
github_runner_registration_token: ""
github_runner_remove_token: ""

# Where the API call is made from. 'control_node' keeps the PAT off the Windows
# host; 'target' uses win_uri if only the runners have egress to GitHub.
github_runner_api_delegate: control_node   # control_node | target

# ---------------------------------------------------------------------------
# Placement
# ---------------------------------------------------------------------------
github_runner_base_dir: 'D:\enterprise-cloud-runners'
github_runner_work_dir: '_work'
github_runner_stage_dir: 'C:\Windows\Temp\gh-runner-pkg'

# ---------------------------------------------------------------------------
# Instances
# Each item: { id (required), name (required), labels, runner_group }
# Directory = "{{ github_runner_base_dir }}\{{ item.id }}"
# ---------------------------------------------------------------------------
github_runner_instances: []
github_runner_default_labels: []
github_runner_default_group: 'Default'

# ---------------------------------------------------------------------------
# Windows service identity
# ---------------------------------------------------------------------------
github_runner_run_as_service: true
github_runner_service_account: ""          # 'DOMAIN\svc' or '.\localuser'; empty => NETWORK SERVICE
github_runner_service_password: ""

# 'win_service'  - config.cmd installs the service, then win_service sets the
#                  credentials. Keeps the password out of the command line and
#                  out of any PowerShell/cmd quoting rules. RECOMMENDED.
# 'config_cmd'   - pass --windowslogonaccount/--windowslogonpassword instead.
github_runner_service_credentials_method: win_service

github_runner_grant_logon_as_service: true
github_runner_grant_dir_acl: true          # give the service account Modify on its runner dir

# ---------------------------------------------------------------------------
# Package
# ---------------------------------------------------------------------------
github_runner_version: latest              # 'latest' or e.g. '2.328.0'
github_runner_arch: x64                    # x64 | arm64
github_runner_download_url: ""             # override to pull from an internal mirror
github_runner_disable_update: true         # pass --disableupdate; you own upgrades

# ---------------------------------------------------------------------------
# Behaviour
# ---------------------------------------------------------------------------
github_runner_force_reconfigure: false     # re-run config.cmd even if .runner exists
github_runner_purge_dir_on_remove: false
github_runner_no_default_labels: false
github_runner_ephemeral: false
github_runner_debug_commands: false        # true disables no_log -- NEVER in CI
