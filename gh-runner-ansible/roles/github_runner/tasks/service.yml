---
# Applies the service identity for ONE instance and leaves the service running.

- name: "[{{ runner.name }}] Read the Windows service name"
  ansible.windows.win_shell: Get-Content -Raw -LiteralPath '.service'
  args:
    chdir: "{{ _ghr_dir }}"
  register: _ghr_svc_raw
  changed_when: false
  check_mode: false

- name: "[{{ runner.name }}] Set the service name fact"
  ansible.builtin.set_fact:
    _ghr_service_name: "{{ _ghr_svc_raw.stdout | default('') | trim | regex_replace('\\.service$', '') }}"

- name: "[{{ runner.name }}] Stop the service before changing its identity"
  ansible.windows.win_service:
    name: "{{ _ghr_service_name }}"
    state: stopped
  when:
    - github_runner_service_account | length > 0
    - github_runner_service_credentials_method == 'win_service'

- name: "[{{ runner.name }}] Set the service logon account"
  ansible.windows.win_service:
    name: "{{ _ghr_service_name }}"
    username: "{{ github_runner_service_account }}"
    password: "{{ github_runner_service_password }}"
    start_mode: auto
  no_log: "{{ not (github_runner_debug_commands | bool) }}"
  when:
    - github_runner_service_account | length > 0
    - github_runner_service_credentials_method == 'win_service'

- name: "[{{ runner.name }}] Ensure the service is running and set to auto start"
  ansible.windows.win_service:
    name: "{{ _ghr_service_name }}"
    state: started
    start_mode: auto

- name: "[{{ runner.name }}] Wait for the runner to report as listening"
  ansible.windows.win_service_info:
    name: "{{ _ghr_service_name }}"
  register: _ghr_svc_info
  until: (_ghr_svc_info.services | first).state == 'started'
  retries: 12
  delay: 5
