---
# For fleets running with --disableupdate. Stops each service, overlays the new
# package (the zip does not contain .runner, .credentials, _work or _diag, so
# the registration survives), then starts the service again.

- name: Stage the runner package
  ansible.builtin.include_tasks: package.yml

- name: Upgrade each instance
  ansible.builtin.include_tasks: _upgrade_instance.yml
  loop: "{{ github_runner_instances }}"
  loop_control:
    loop_var: runner
    label: "{{ runner.id }} -> {{ runner.name }} -> {{ _ghr_version }}"
