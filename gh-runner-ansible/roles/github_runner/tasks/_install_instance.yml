---
- name: "[{{ runner.name }}] Resolve the instance directory"
  ansible.builtin.set_fact:
    _ghr_dir: "{{ github_runner_base_dir }}\\{{ runner.id }}"

- name: "[{{ runner.name }}] Ensure the instance directory exists"
  ansible.windows.win_file:
    path: "{{ _ghr_dir }}"
    state: directory

- name: "[{{ runner.name }}] Grant the service account Modify on the instance directory"
  ansible.windows.win_acl:
    path: "{{ _ghr_dir }}"
    user: "{{ github_runner_service_account }}"
    rights: Modify,Synchronize
    type: allow
    state: present
    inherit: ContainerInherit, ObjectInherit
    propagation: None
  when:
    - github_runner_service_account | length > 0
    - github_runner_grant_dir_acl | bool

- name: "[{{ runner.name }}] Check whether the runner binaries are present"
  ansible.windows.win_stat:
    path: "{{ _ghr_dir }}\\config.cmd"
  register: _ghr_binaries

- name: "[{{ runner.name }}] Extract the runner package"
  community.windows.win_unzip:
    src: "{{ _ghr_zip_path }}"
    dest: "{{ _ghr_dir }}"
    creates: "{{ _ghr_dir }}\\config.cmd"
  when: not _ghr_binaries.stat.exists

- name: "[{{ runner.name }}] Check for an existing registration"
  ansible.windows.win_stat:
    path: "{{ _ghr_dir }}\\.runner"
  register: _ghr_runner_file

- name: "[{{ runner.name }}] Register with GitHub"
  ansible.builtin.include_tasks: configure.yml
  when: (not _ghr_runner_file.stat.exists) or (github_runner_force_reconfigure | bool)
