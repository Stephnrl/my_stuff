---
# Re-registers instances that are already on disk (your 1/ 2/ 3/ 4/).
# Nothing is downloaded and nothing is extracted.

- name: Obtain registration and removal tokens
  ansible.builtin.include_tasks: token.yml
  vars:
    _ghr_want_registration: true
    _ghr_want_remove: true

- name: Grant "Log on as a service" to the runner service account
  ansible.windows.win_user_right:
    name: SeServiceLogonRight
    users: ["{{ github_runner_service_account }}"]
    action: add
  when:
    - github_runner_run_as_service | bool
    - github_runner_service_account | length > 0
    - github_runner_grant_logon_as_service | bool

- name: Verify every instance is actually deployed
  ansible.windows.win_stat:
    path: "{{ github_runner_base_dir }}\\{{ item.id }}\\config.cmd"
  loop: "{{ github_runner_instances }}"
  loop_control:
    label: "{{ item.id }}"
  register: _ghr_present

- name: Fail when an instance directory is missing its binaries
  ansible.builtin.fail:
    msg: >-
      No config.cmd under {{ github_runner_base_dir }}\{{ item.item.id }}.
      Run the install playbook for that instance instead of reregister.
  loop: "{{ _ghr_present.results }}"
  loop_control:
    label: "{{ item.item.id }}"
  when: not item.stat.exists

- name: Re-register each instance
  ansible.builtin.include_tasks: configure.yml
  loop: "{{ github_runner_instances }}"
  loop_control:
    loop_var: runner
    label: "{{ runner.id }} -> {{ runner.name }}"
