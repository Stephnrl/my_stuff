---
# Produces _ghr_registration_token and/or _ghr_remove_token.
# Callers set _ghr_want_registration / _ghr_want_remove before including.
#
# Registration and removal tokens are valid for one hour and are minted per run,
# so nothing long-lived is ever written to the Windows host.

- name: Use the supplied registration token
  ansible.builtin.set_fact:
    _ghr_registration_token: "{{ github_runner_registration_token }}"
  no_log: "{{ not (github_runner_debug_commands | bool) }}"
  when: github_runner_registration_token | length > 0

- name: Use the supplied removal token
  ansible.builtin.set_fact:
    _ghr_remove_token: "{{ github_runner_remove_token }}"
  no_log: "{{ not (github_runner_debug_commands | bool) }}"
  when: github_runner_remove_token | length > 0

# ---------------------------------------------------------------------------
# Registration token
# ---------------------------------------------------------------------------
- name: Mint a registration token
  when:
    - _ghr_want_registration | default(false) | bool
    - _ghr_registration_token is not defined
  block:
    - name: Request a registration token from the control node
      ansible.builtin.uri:
        url: "{{ _ghr_registration_token_url }}"
        method: POST
        headers: "{{ _ghr_api_headers }}"
        status_code: [201]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: _ghr_reg_local
      check_mode: false
      no_log: "{{ not (github_runner_debug_commands | bool) }}"
      when: github_runner_api_delegate == 'control_node'

    - name: Request a registration token from the runner host
      ansible.windows.win_uri:
        url: "{{ _ghr_registration_token_url }}"
        method: POST
        headers: "{{ _ghr_api_headers }}"
        status_code: [201]
        return_content: true
      register: _ghr_reg_target
      check_mode: false
      no_log: "{{ not (github_runner_debug_commands | bool) }}"
      when: github_runner_api_delegate == 'target'

    - name: Store the registration token
      ansible.builtin.set_fact:
        _ghr_registration_token: >-
          {{ (_ghr_reg_local.json.token) if (github_runner_api_delegate == 'control_node')
             else (_ghr_reg_target.json.token) }}
      no_log: "{{ not (github_runner_debug_commands | bool) }}"

# ---------------------------------------------------------------------------
# Removal token
# ---------------------------------------------------------------------------
- name: Mint a removal token
  when:
    - _ghr_want_remove | default(false) | bool
    - _ghr_remove_token is not defined
  block:
    - name: Request a removal token from the control node
      ansible.builtin.uri:
        url: "{{ _ghr_remove_token_url }}"
        method: POST
        headers: "{{ _ghr_api_headers }}"
        status_code: [201]
      delegate_to: localhost
      vars:
        ansible_connection: local
      register: _ghr_rm_local
      check_mode: false
      no_log: "{{ not (github_runner_debug_commands | bool) }}"
      when: github_runner_api_delegate == 'control_node'

    - name: Request a removal token from the runner host
      ansible.windows.win_uri:
        url: "{{ _ghr_remove_token_url }}"
        method: POST
        headers: "{{ _ghr_api_headers }}"
        status_code: [201]
        return_content: true
      register: _ghr_rm_target
      check_mode: false
      no_log: "{{ not (github_runner_debug_commands | bool) }}"
      when: github_runner_api_delegate == 'target'

    - name: Store the removal token
      ansible.builtin.set_fact:
        _ghr_remove_token: >-
          {{ (_ghr_rm_local.json.token) if (github_runner_api_delegate == 'control_node')
             else (_ghr_rm_target.json.token) }}
      no_log: "{{ not (github_runner_debug_commands | bool) }}"
