---
- name: Obtain a registration token
  ansible.builtin.include_tasks: token.yml
  vars:
    _ghr_want_registration: true

- name: Stage the runner package
  ansible.builtin.include_tasks: package.yml

- name: Grant "Log on as a service" to the runner service account
  ansible.windows.win_user_right:
    name: SeServiceLogonRight
    users: ["{{ github_runner_service_account }}"]
    action: add
  when:
    - github_runner_run_as_service | bool
    - github_runner_service_account | length > 0
    - github_runner_grant_logon_as_service | bool

- name: Ensure the runner base directory exists
  ansible.windows.win_file:
    path: "{{ github_runner_base_dir }}"
    state: directory

- name: Install each runner instance
  ansible.builtin.include_tasks: _install_instance.yml
  loop: "{{ github_runner_instances }}"
  loop_control:
    loop_var: runner
    label: "{{ runner.id }} -> {{ runner.name }}"
