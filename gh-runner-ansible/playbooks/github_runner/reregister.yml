---
# Re-register runners that are already on disk. Use after rotating the service
# account password, moving runner groups, changing labels, or when the
# credentials on the host have gone stale.
#
#   ansible-playbook playbooks/github_runner/reregister.yml
#   ansible-playbook playbooks/github_runner/reregister.yml -e 'only=["1","3"]'
- name: Re-register existing GitHub Actions runners
  hosts: "{{ target | default('gh_runners') }}"
  gather_facts: true
  serial: "{{ batch | default('100%') }}"
  roles:
    - role: github_runner
      github_runner_action: reregister
      github_runner_instances: >-
        {{ github_runner_instances
           | selectattr('id', 'in', only)
           | list
           if (only is defined) else github_runner_instances }}
