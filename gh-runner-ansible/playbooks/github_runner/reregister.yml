---
# Re-register instances already on disk. Nothing is downloaded or extracted.
# Use after a service-account password rotation, a runner-group move, a label
# change, or when host-side credentials have gone stale.
#
# Optional per-run overrides:
#   GH_RUNNER_ONLY   comma-separated instance ids, e.g. "1,3"
#   GH_RUNNER_BATCH  hosts per wave - set to "1" for a cautious rollout
- name: Re-register existing GitHub Actions runners
  hosts: "{{ lookup('ansible.builtin.env', 'GH_RUNNER_TARGET') | default('gh_runners', true) }}"
  gather_facts: true
  serial: "{{ lookup('ansible.builtin.env', 'GH_RUNNER_BATCH') | default('100%', true) }}"
  roles:
    - role: github_runner
      github_runner_action: reregister
