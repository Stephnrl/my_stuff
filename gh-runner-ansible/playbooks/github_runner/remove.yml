---
# Destructive. Requires an explicit confirmation variable.
#
#   ansible-playbook playbooks/github_runner/remove.yml -e confirm_remove=yes
- name: Remove GitHub Actions self-hosted runners
  hosts: "{{ target | default('gh_runners') }}"
  gather_facts: true
  pre_tasks:
    - name: Require an explicit confirmation
      ansible.builtin.assert:
        that: (confirm_remove | default('')) == 'yes'
        fail_msg: "Re-run with -e confirm_remove=yes to unregister these runners."
        quiet: true
  roles:
    - role: github_runner
      github_runner_action: remove
      github_runner_instances: >-
        {{ github_runner_instances
           | selectattr('id', 'in', only)
           | list
           if (only is defined) else github_runner_instances }}
