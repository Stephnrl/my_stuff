[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "projectops"
version = "0.1.0"
description = "Declarative Kanban + Scrum automation for GitHub Projects v2"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
app = ["pyjwt>=2.8", "cryptography>=42.0"]
azure = ["azure-identity>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
projectops = "projectops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/projectops"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
