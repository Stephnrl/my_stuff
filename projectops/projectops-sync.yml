name: ProjectOps Sync

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, assigned, unassigned]

# Board writes are not commutative -- two runs racing on the same issue can
# leave the wrong Status. Serialise per issue, and do NOT cancel in progress:
# a cancelled run leaves the board half-written.
concurrency:
  group: projectops-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Mint a short-lived App installation token. Only works for ORG-owned
      # projects. For a user-owned board, delete this step and pass a classic
      # PAT with `project` scope directly to the action below.
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PROJECTOPS_APP_ID }}
          private-key: ${{ secrets.PROJECTOPS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: ./.github/actions/projectops
        with:
          token: ${{ steps.app-token.outputs.token }}
          # token: ${{ secrets.PROJECTOPS_PAT }}   # user-owned board
