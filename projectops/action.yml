name: ProjectOps
description: Sync a GitHub issue onto a Projects v2 board using declarative rules

# Composite action caveats worth knowing before you debug:
#   * A composite action CANNOT declare `permissions:` -- it runs inside the
#     caller's job and inherits that job's token.
#   * Secrets are NOT inherited automatically. Every credential must arrive
#     as an explicit input, which is why `token` below is required.
#   * GITHUB_TOKEN is useless here. Projects v2 needs a PAT or an App token.

inputs:
  token:
    description: >
      Projects-capable token. Org projects: App installation token with
      "Organization projects: Read and write", or a fine-grained PAT with the
      same. User-owned projects: classic PAT with `project` scope.
    required: true
  issue-number:
    description: Issue number to sync. Defaults to the triggering issue.
    required: false
    default: ${{ github.event.issue.number }}
  event:
    description: Event name driving rule matching (opened, closed, labeled...).
    required: false
    default: ${{ github.event.action }}
  config:
    description: Path to projectops.yml
    required: false
    default: projectops.yml
  dry-run:
    description: Resolve and print the plan without writing to the board
    required: false
    default: "false"
  python-version:
    required: false
    default: "3.12"

outputs:
  status:
    description: success | skipped | failed
    value: ${{ steps.sync.outputs.status }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # Installing from the action's own directory keeps the action
    # self-contained; swap for a pinned PyPI/wheel release once you cut one.
    - name: Install projectops
      shell: bash
      run: pip install --quiet "${{ github.action_path }}/../../.."

    - name: Sync board
      id: sync
      shell: bash
      env:
        PROJECTOPS_TOKEN: ${{ inputs.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        args=(--issue "${{ inputs.issue-number }}"
              --event "${{ inputs.event }}"
              --config "${{ inputs.config }}")
        [[ "${{ inputs.dry-run }}" == "true" ]] && args+=(--dry-run)

        if projectops sync "${args[@]}"; then
          echo "status=success" >> "$GITHUB_OUTPUT"
        else
          echo "status=failed" >> "$GITHUB_OUTPUT"
          exit 1
        fi
